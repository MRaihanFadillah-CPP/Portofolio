<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Immersive 3D Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js CDN untuk Animasi 3D Latar Belakang -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Kanvas Three.js untuk Background 3D Immersive -->
    <canvas id="bgCanvas"></canvas>

    <div class="app-container">
        <!-- Header Aplikasi -->
        <header class="app-header">
            <div class="header-title">
                <h1>TaskFlow<span class="dot">.</span></h1>
                <p>Immersive 3D Workspace & Task Manager.</p>
            </div>
            <div class="header-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Ganti Tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Kartu Utama To-Do App dengan Efek 3D Depth & Tilt -->
        <main class="todo-card" id="tiltCard">
            <!-- Statistik Progress Bar -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>Progress Penyelesaian</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Form Input Tugas -->
            <div class="todo-form">
                <input type="text" id="todoInput" placeholder="Tambahkan tugas 3D interaktif...">
                <div class="form-row">
                    <div class="input-group-date" title="Deadline">
                        <label for="todoDate"><i class="fa-regular fa-calendar"></i></label>
                        <input type="date" id="todoDate">
                    </div>
                    <div class="input-group-priority">
                        <select id="todoPriority">
                            <option value="low">Rendah</option>
                            <option value="medium" selected>Sedang</option>
                            <option value="high">Penting</option>
                        </select>
                    </div>
                    <div class="input-group-category">
                        <select id="todoCategory">
                            <option value="Kuliah">Kuliah</option>
                            <option value="Koding">Koding</option>
                            <option value="Pribadi">Pribadi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <button id="addTodoBtn" class="btn-add">
                        <i class="fa-solid fa-plus"></i> Tambah
                    </button>
                </div>
            </div>

            <!-- Toolbar (Pencarian & Sorting) -->
            <div class="toolbar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari tugas...">
                </div>
                <div class="sort-container">
                    <select id="sortSelect" title="Urutkan Tugas">
                        <option value="default">Urutkan</option>
                        <option value="deadline">Deadline Terdekat</option>
                        <option value="priority">Prioritas Tertinggi</option>
                    </select>
                </div>
            </div>

            <!-- Filter Kategori & Status -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="active">Aktif</button>
                <button class="filter-btn" data-filter="completed">Selesai</button>
            </div>

            <!-- Daftar Tugas -->
            <ul id="todoList" class="todo-list">
                <!-- Tugas dinamis -->
            </ul>

            <!-- Footer Status & Backup -->
            <div class="todo-footer">
                <span id="taskCounter">0 tugas tersisa</span>
                <div class="footer-actions-btn">
                    <button id="exportBtn" class="action-link" title="Backup ke JSON"><i class="fa-solid fa-download"></i> Ekspor</button>
                    <label for="importFile" class="action-link" title="Pulihkan dari JSON" style="cursor: pointer;"><i class="fa-solid fa-upload"></i> Impor</label>
                    <input type="file" id="importFile" accept=".json" style="display: none;">
                    <button id="clearAllBtn" class="clear-btn">Hapus Selesai</button>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 TaskFlow. Immersive 3D Experience.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
